name: android

# Builds the Android release artifacts.
#
# ## What this workflow does and does not do
#
# It compiles the Kotlin plugin — a channel handler, a capability reporter and a
# settings helper, with no tunnel engine and no third-party dependencies — and
# produces the signed APK and App Bundle. The app installs and runs; it cannot
# connect to anything, because Android has no engine in this build, and it says
# so instead of failing mysteriously.
#
# It does **not** run a tunnel, because there is nothing to run. Device
# verification is documented in docs/BUILDING.md; the on-device engine suite
# went away with the engine it tested.
#
# ## Dependency verification
#
# android/gradle/verification-metadata.xml pins a SHA-256 for every Gradle
# artifact. The jobs below resolve the full release classpath, so a substituted
# or unlisted artifact fails the run rather than being linked quietly.
#
# ## Signing
#
# Release signing needs a key this repository does not and must not contain.
# When `android/key.properties` is absent the build signs with the Gradle debug
# key, `build.gradle.kts` prints a warning saying so, and the job still
# succeeds — because "no upload key" is a configuration state, not a code
# defect, and failing every pull request over it would only teach people to
# ignore this workflow. The job's own summary states which key was used, so an
# artifact produced here can never be mistaken for a distributable one.
#
# ## Third-party actions
#
# All first-party, each pinned to an immutable commit SHA resolved through the
# GitHub API and checked against the release commit it names:
#
#   actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   (v4.2.2)
#   actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 (v5)
#   gradle/actions@0723195856401067f7a2779048b490ace7a47d7c     (v5)
#   actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 (v4.6.2)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0
  FLUTTER_CHANNEL: stable
  # SHA-256 of flutter_linux_${FLUTTER_VERSION}-${FLUTTER_CHANNEL}.tar.xz.
  # Recorded when this repository was verified against Flutter 3.47.0; a
  # mismatch aborts the build rather than unpacking an SDK this project was
  # never tested with.
  FLUTTER_SHA256: 26cd99d3d94b1367e6b50535a18aeef0282c10a535bbe3ec493534dcdab75296
  JAVA_VERSION: '21'

jobs:
  unit-tests:
    name: Dependency verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions@0723195856401067f7a2779048b490ace7a47d7c

      - name: Install Flutter
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          FLUTTER_CHANNEL: ${{ env.FLUTTER_CHANNEL }}
          FLUTTER_SHA256: ${{ env.FLUTTER_SHA256 }}
        run: |
          tools/install_flutter.sh "${{ runner.tool_cache }}/flutter-${FLUTTER_VERSION}"
          echo "${{ runner.tool_cache }}/flutter-${FLUTTER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          flutter config --no-analytics --no-cli-animations >/dev/null
          flutter pub get

      # There are no JVM unit tests any more: the request-parser suite was
      # deleted with the parser it tested. The Gradle test task still runs
      # because resolving it verifies every artifact the release build needs
      # against android/gradle/verification-metadata.xml — which is the gate
      # this job exists for. It is never switched off to make a resolution
      # succeed: an unverified dependency is exactly what the gate catches, so
      # a failure is reported as a failure.
      - name: Verify the dependency graph
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

  build:
    name: Release artifacts
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions@0723195856401067f7a2779048b490ace7a47d7c

      - name: Install Flutter
        env:
          FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
          FLUTTER_CHANNEL: ${{ env.FLUTTER_CHANNEL }}
          FLUTTER_SHA256: ${{ env.FLUTTER_SHA256 }}
        run: |
          tools/install_flutter.sh "${{ runner.tool_cache }}/flutter-${FLUTTER_VERSION}"
          echo "${{ runner.tool_cache }}/flutter-${FLUTTER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: |
          flutter config --no-analytics --no-cli-animations >/dev/null
          flutter pub get

      - name: Build the App Bundle
        run: flutter build appbundle --release

      - name: Build per-ABI APKs
        # One APK per ABI rather than the fat APK. The fat release APK is 60 MB
        # because it carries three copies of the same Dart snapshot; the split
        # ones are 18-22 MB, and a user should not download two of them.
        run: flutter build apk --release --split-per-abi

      - name: Record which key signed the artifacts
        run: |
          {
            echo "### Signing"
            if [ -f android/key.properties ]; then
              echo "Signed with the project's release key from android/key.properties."
            else
              echo "**No release key was available.** These artifacts are signed"
              echo "with the Gradle debug key and are for testing only."
              echo "The Play Store rejects debug-signed uploads, and once an upload"
              echo "has used a key that key cannot be replaced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantrix-android-bundle
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload the APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantrix-android-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the R8 mapping
        # Needed to de-obfuscate a crash report from a minified build. Without
        # it a release stack trace is unreadable, which makes the minification
        # enabled in build.gradle.kts a net loss in debuggability.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phantrix-android-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
