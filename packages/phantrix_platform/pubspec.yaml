name: phantrix_platform
description: Native VPN platform bindings for Phantrix (Android VpnService, Windows/Linux tunnels, Apple Network Extension).
version: 1.0.1
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  phantrix_core:
    path: ../phantrix_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    # `android`, `linux` and `windows` each have a real native implementation.
    # Windows is the one that can start a tunnel in this build (the official
    # OpenVPN binaries); Linux drives the kernel's WireGuard through `wg-quick`;
    # Android has no engine and answers a start request with the reason.
    #
    # `macos` and `ios` are deliberately not declared: the Apple sources under
    # `apple/` have never been compiled, signed or wired into an Xcode target,
    # so no Apple platform is a supported build target. The Dart layer reports
    # each undeclared platform as unsupported explicitly. See ARCHITECTURE.md.
    platforms:
      android:
        package: dev.phantrix.phantrix_platform
        pluginClass: PhantrixPlugin
      linux:
        pluginClass: PhantrixPlugin
      windows:
        pluginClass: PhantrixPlugin
